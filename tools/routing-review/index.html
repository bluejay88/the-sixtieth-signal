<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%2305090b%22 stroke=%22%2355ddff%22/><text x=%2232%22 y=%2240%22 text-anchor=%22middle%22 font-size=%2222%22 fill=%22%23d8ad58%22>60</text></svg>">
  <title>Signal Routing Review</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <a href="/" class="brand" aria-label="Project root"><span>60</span> ROUTING REVIEW</a>
    <div class="status"><i></i><strong>LOCAL ONLY</strong><span>No manuscript data leaves this browser.</span></div>
  </header>
  <main>
    <section class="controls" aria-label="Review controls">
      <label>Chapter<select id="chapter"></select></label>
      <label>Filter<select id="filter"><option value="all">All spans</option><option value="unresolved">Unresolved</option><option value="explicit">Named proposals</option><option value="approved">Approved locally</option></select></label>
      <label class="upload">Open routing JSON<input id="file" type="file" accept="application/json"></label>
      <button id="export" type="button">Export decisions</button>
    </section>
    <section class="summary" aria-live="polite">
      <div><small>CHAPTER</small><strong id="chapter-title">Loading…</strong></div>
      <div><small>VISIBLE</small><strong id="visible-count">—</strong></div>
      <div><small>APPROVED</small><strong id="approved-count">0</strong></div>
      <div><small>UNRESOLVED</small><strong id="unresolved-count">—</strong></div>
    </section>
    <section class="workspace">
      <nav id="queue" aria-label="Dialogue span queue"></nav>
      <article id="inspector" tabindex="-1">
        <p class="empty">Select a dialogue span to begin.</p>
      </article>
    </section>
  </main>
  <footer><span>J / K — next or previous</span><span>A — approve</span><span>U — mark unresolved</span><span>Decisions save locally until exported.</span></footer>
  <script src="./app.js"></script>
</body>
</html>
