[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Nothing on this project is meant to be browsed. Every route is either an
# authenticated admin API or a narrow public write/read endpoint — there is
# no HTML frontend here on purpose.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, private"
